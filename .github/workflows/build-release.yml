name: build-release
run-name: "🚀 nuwaxcode ${{ github.ref_name }}"

# 仅通过 push semver tag 触发（如 v1.3.0、v1.3.0-beta.1）；
# 不受理 vscode-v* 等非版本号 tag。
on:
  push:
    tags:
      - "v[0-9]*"

concurrency: build-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.dist_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        run: |
          bun install
          mkdir -p packages/opencode/node_modules/@opentui
          for pkg in solid core; do
            if [ ! -e packages/opencode/node_modules/@opentui/$pkg ]; then
              ln -s "$(pwd)/node_modules/@opentui/$pkg" packages/opencode/node_modules/@opentui/$pkg
              echo "Linked @opentui/$pkg"
            fi
          done

      - name: Update bundled models.json
        run: bun run scripts/update-models.ts

      - name: Read version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      # 预发布版本（如 1.3.0-beta.8）发布到 beta dist-tag，避免污染 latest
      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          TAG="$("./scripts/resolve-npm-dist-tag.sh" "${{ steps.version.outputs.version }}")"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "channel=$TAG" >> $GITHUB_OUTPUT
          echo "npm dist-tag: $TAG"

      - name: Sync package.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          export VERSION
          bun -e "
            const fs = require('fs');
            const path = 'packages/opencode/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = process.env.VERSION;
            if (pkg.optionalDependencies) {
              for (const key of Object.keys(pkg.optionalDependencies)) {
                if (key.startsWith('nuwaxcode-')) pkg.optionalDependencies[key] = process.env.VERSION;
              }
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build all targets
        working-directory: packages/opencode
        run: bun run script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.dist_tag.outputs.channel }}

      - name: List dist directories
        run: ls -la packages/opencode/dist/

      - name: Copy bundled models.json
        run: |
          cd packages/opencode
          for dir in dist/*/; do
            mkdir -p "${dir}bin/assets"
            cp assets/models.json "${dir}bin/assets/"
            echo "Copied models.json to ${dir}bin/assets/"
          done

      - name: Re-sign darwin binaries (ad-hoc)
        # bun cross-compiles darwin targets on Linux; the embedded linker-signed
        # ad-hoc signature does not validate on macOS, so AMFI kills the binary
        # with SIGKILL on exec. rcodesign re-signs with matching hashes from
        # Linux (pin the version + checksum; musl build runs on any runner).
        run: |
          version=0.29.0
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${version}/apple-codesign-${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o /tmp/rcs.tar.gz "$url"
          expected=$(curl -sSfL "$url.sha256" | awk '{print $1}')
          echo "$expected  /tmp/rcs.tar.gz" | sha256sum -c -
          tar xzf /tmp/rcs.tar.gz -C /tmp
          rcs=$(find /tmp -type f -name rcodesign | head -1)
          "$rcs" --version
          shopt -s nullglob
          bins=(packages/opencode/dist/nuwaxcode-darwin-*/bin/opencode)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no darwin binaries found under packages/opencode/dist/nuwaxcode-darwin-*" >&2
            exit 1
          fi
          for bin in "${bins[@]}"; do
            "$rcs" sign "$bin"
          done
          echo "Re-signed ${#bins[@]} darwin binary(ies)"

      - name: Create archives
        run: |
          cd packages/opencode
          VERSION="${{ steps.version.outputs.version }}"
          for dir in dist/*/; do
            name=$(basename "$dir")
            echo "--- Archiving $name ---"
            tar czf "${{ github.workspace }}/${name}-v${VERSION}.tar.gz" -C "${dir}bin" .
            if [[ "$name" == *windows* ]]; then
              (cd "${dir}bin" && zip -r "${{ github.workspace }}/${name}-v${VERSION}.zip" .)
            fi
          done

      - name: List archives
        run: ls -lh ${{ github.workspace }}/*.tar.gz ${{ github.workspace }}/*.zip 2>/dev/null || true

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms-v${{ steps.version.outputs.version }}
          retention-days: 1
          path: |
            ${{ github.workspace }}/*.tar.gz
            ${{ github.workspace }}/*.zip

      - name: Upload dist for npm publish
        uses: actions/upload-artifact@v4
        with:
          name: opencode-dist-v${{ steps.version.outputs.version }}
          retention-days: 1
          path: packages/opencode/dist/

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: all-platforms-v${{ needs.build.outputs.version }}
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" 2>/dev/null; then
            echo "Release $TAG already exists, updating assets..."
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" --title "$TAG" --notes "nuwaxcode $TAG"
          fi

          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read file; do
            echo "Uploading: $file"
            gh release upload "$TAG" "$file" --clobber
          done

          echo "=== Release $TAG assets ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'

  publish-npm:
    needs: build
    if: needs.build.result == 'success' && github.repository == 'nuwax-ai/nuwaxcode'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-dist-v${{ needs.build.outputs.version }}
          path: packages/opencode/dist

      - name: Install dependencies (publish.ts needs workspace packages)
        run: bun install --frozen-lockfile

      - name: Publish to npm (release-publish.sh)
        run: ./scripts/release-publish.sh "${{ needs.build.outputs.version }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          NPM_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          SKIP_DOCKER_PUBLISH: "1"
          # CI 不执行 dist 二进制 smoke（编译产物在 runner 上可能因运行时依赖失败）；版本由 dist package.json 保证
          SKIP_LOCAL_SMOKE: "1"
